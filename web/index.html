<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WBC-QR - Generate QR codes for your files and links">
  <meta name="google-signin-client_id" content="512727697417-u4chdn4is1pfb2asmrqifq382ghmq5na.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WBC-QR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WBC-QR</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Clear any previously installed Flutter service worker so users always get
    the latest deployed build. This app is rebuilt frequently and does not need
    offline caching; the web build also uses --pwa-strategy=none.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var flag = 'wbc-qr-service-worker-cleared';
      try {
        if (sessionStorage.getItem(flag)) return;
      } catch (e) {}
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        if (!registrations.length) return;
        Promise.all(registrations.map(function (r) { return r.unregister(); }))
          .then(function () {
            try {
              sessionStorage.setItem(flag, '1');
            } catch (e) {}
            window.location.reload();
          })
          .catch(function () {});
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
